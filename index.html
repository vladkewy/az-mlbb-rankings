<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ MLBB Rankings</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --gold: #f59e0b;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
            color: var(--text-sub);
        }

        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-number {
            font-weight: bold;
            font-size: 18px;
            width: 28px;
            text-align: center;
            color: var(--accent-color);
        }

        .player-card:nth-child(1) .rank-number { color: var(--gold); font-size: 22px; }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #334155;
            object-fit: cover;
        }

        .details {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-weight: 600;
            font-size: 16px;
        }

        .heroes {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .points {
            font-weight: 700;
            font-size: 16px;
            color: var(--gold);
        }

        .loading, .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AZ MLBB Rankings</h1>
        <p>Azerbaijan Mobile Legends Player Rankings</p>
    </div>

    <div class="rank-list" id="rankings-container">
        <div class="loading">Sıralama yüklenir...</div>
    </div>

    <script>
        // Supabase Konfigürasyonu
        const SUPABASE_URL = 'https://xhmemtpmcaqldwodjbna.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_L55TIv9PWvH-aChV3EvNNQ_9Dz1VPbt';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchRankings() {
            const container = document.getElementById('rankings-container');
            
            try {
                const { data: players, error } = await _supabase
                    .from('players')
                    .select('*')
                    .order('points', { ascending: false });

                if (error) throw error;

                if (!players || players.length === 0) {
                    container.innerHTML = '<div class="empty">Henüz oyuncu eklenmedi.</div>';
                    return;
                }

                container.innerHTML = players.map((player, index) => `
                    <div class="player-card">
                        <div class="player-info">
                            <div class="rank-number">#${index + 1}</div>
                            <img class="avatar" src="${player.avatar_url || 'https://via.placeholder.com/150'}" alt="${player.name}">
                            <div class="details">
                                <div class="player-name">${player.name}</div>
                                <div class="heroes">${player.main_heroes ? player.main_heroes.join(', ') : 'Hero belirtilmedi'}</div>
                            </div>
                        </div>
                        <div class="points">${player.points} PTS</div>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Hata:', err);
                container.innerHTML = '<div class="empty">Veriler alınırken bir hata oluştu.</div>';
            }
        }

        fetchRankings();
    </script>
</body>
</html>
