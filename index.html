<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ MLBB Rankings</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #07101c;
            --panel: #0e1b2d;
            --line: #263b55;
            --text: #edf4ff;
            --muted: #3db1c7;
            --gold: #f2cd5d;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 16px; }
        .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
        .logo { font-weight: 900; font-size: 20px; color: #38bdf8; }
        .hero { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
        .hero h1 { margin: 4px 0 8px; font-size: 24px; }
        .hero p { margin: 0; color: #94a3b8; font-size: 14px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
        .stat b { font-size: 24px; display: block; }
        .lanes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .lane { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .lane.active { border-color: var(--gold); color: var(--gold); }
        .tools { display: flex; gap: 8px; }
        input, select { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 10px; border-radius: 8px; width: 100%; }
        .btn { background: #0284c7; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .board { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .player-card { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .player-card:last-child { border-bottom: none; }
        .rank { font-weight: bold; width: 30px; color: #38bdf8; }
        .p-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #1e293b; object-fit: cover; }
        .pts { font-weight: bold; color: var(--gold); }
        .empty { padding: 30px; text-align: center; color: #94a3b8; }
        details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
        summary { font-weight: bold; cursor: pointer; color: #38bdf8; }
        .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div class="logo">AZ MLBB</div>
            <small style="color:#94a3b8;">Azerbaijan Player Rankings</small>
        </header>

        <section class="hero">
            <small style="color:#38bdf8; font-weight:bold;">AZƏRBAYCAN MLBB SƏHNƏSİ</small>
            <h1>Real qiymətləndirmə.</h1>
            <p>Oyunçu reytinqi şəxsi müşahidə, oyun statistikaları, turnir nailiyyətləri və sabitlik əsasında hesablanır.</p>
        </section>

        <section class="stats">
            <div class="stat"><b id="pCount">0</b><small>OYUNÇU</small></div>
            <div class="stat"><b>5</b><small>LANE</small></div>
        </section>

        <div class="lanes">
            <button class="lane active" onclick="setLane('EXP', this)">EXP</button>
            <button class="lane" onclick="setLane('Jungle', this)">JUNGLE</button>
            <button class="lane" onclick="setLane('Mid', this)">MID</button>
            <button class="lane" onclick="setLane('Gold', this)">GOLD</button>
            <button class="lane" onclick="setLane('Roam', this)">ROAM</button>
        </div>

        <div class="tools">
            <input type="text" id="search" placeholder="Oyunçu axtar..." oninput="render()">
        </div>

        <div class="board" id="board">
            <div class="empty">Yüklənir...</div>
        </div>

        <details>
            <summary>► Admin paneli — oyunçu əlavə et</summary>
            <form id="addForm" onsubmit="addPlayer(event)" class="formgrid">
                <input type="text" id="pName" placeholder="Oyunçu Adı (Nik)" required>
                <input type="number" id="pPoints" placeholder="Xal (PTS)" required>
                <select id="pLane">
                    <option value="EXP">EXP</option>
                    <option value="Jungle">Jungle</option>
                    <option value="Mid">Mid</option>
                    <option value="Gold">Gold</option>
                    <option value="Roam">Roam</option>
                </select>
                <input type="text" id="pHeroes" placeholder="Əsas Herolar (məs: Fanny, Chou)">
                <button class="btn" style="grid-column: span 2;">Oyunçunu Bazaya Əlavə Et</button>
            </form>
        </details>
    </div>

    <script>
        const SUPABASE_URL = 'https://xhmemtpmcaqldwodjbna.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_L55TIv9PWvH-aChV3EvNNQ_9Dz1VPbt';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allPlayers = [];
        let activeLane = 'EXP';

        async function loadData() {
            const { data, error } = await _supabase.from('players').select('*').order('points', { ascending: false });
            if (!error && data) {
                allPlayers = data;
                document.getElementById('pCount').innerText = allPlayers.length;
                render();
            }
        }

        function setLane(lane, btn) {
            activeLane = lane;
            document.querySelectorAll('.lane').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function render() {
            const search = document.getElementById('search').value.toLowerCase();
            const board = document.getElementById('board');
            
            let filtered = allPlayers.filter(p => 
                (p.lane === activeLane || !p.lane) && 
                p.name.toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                board.innerHTML = `<div class="empty">Bu lane üzrə oyunçu yoxdur.</div>`;
                return;
            }

            board.innerHTML = filtered.map((p, i) => `
                <div class="player-card">
                    <div class="p-info">
                        <div class="rank">#${i + 1}</div>
                        <img class="avatar" src="${p.avatar_url || 'https://via.placeholder.com/150'}" alt="">
                        <div>
                            <strong>${p.name}</strong>
                            <div style="font-size:12px; color:#94a3b8;">${p.main_heroes ? p.main_heroes.join(', ') : ''}</div>
                        </div>
                    </div>
                    <div class="pts">${p.points} PTS</div>
                </div>
            `).join('');
        }

        async function addPlayer(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const points = parseInt(document.getElementById('pPoints').value);
            const lane = document.getElementById('pLane').value;
            const heroes = document.getElementById('pHeroes').value.split(',').map(h => h.trim());

            const { error } = await _supabase.from('players').insert([{
                name: name,
                points: points,
                lane: lane,
                main_heroes: heroes
            }]);

            if (!error) {
                alert('Oyunçu bazaya əlavə edildi!');
                document.getElementById('addForm').reset();
                loadData();
            } else {
                alert('Xəta baş verdi: ' + error.message);
            }
        }

        loadData();
    </script>
</body>
</html>
